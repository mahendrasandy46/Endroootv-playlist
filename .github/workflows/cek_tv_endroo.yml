name: Auto-Check Playlist tv_endroo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter URL Aktif
        run: |
          INPUT="tv_endrooo.m3u"
          ACTIVE="tv_endrooo_aktif.m3u"

          # Reset file aktif
          rm -f "$ACTIVE"
          echo "#EXTM3U" > "$ACTIVE"

          CURRENT_INFO=""
          
          # Proses baca per baris
          tr -d '\r' < "$INPUT" | while IFS= read -r line || [ -n "$line" ]; do
            # PERBAIKAN: Menambahkan tanda kutip pada "$line" dan "#EXTINF"*
            if [[ "$line" == "#EXTINF"* ]]; then
              CURRENT_INFO="$line"
            elif [[ "$line" == "http"* ]]; then
              # Menggunakan User-Agent VLC dan meminta sedikit byte data (-r 0-1000) agar tidak hang pada live stream
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -r 0-1000 -A "VLC/3.0.18" -m 5 "$line")
              
              # 200 = OK, 206 = Partial Content (karena kita pakai -r), 302 = Redirect
              if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "206" || "$HTTP_CODE" == "302" ]]; then
                echo "$CURRENT_INFO" >> "$ACTIVE"
                echo "$line" >> "$ACTIVE"
              fi
              CURRENT_INFO=""
            fi
          done

      - name: Commit File Baru ke GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync: Membersihkan tv_endroo.m3u dari link mati"
          file_pattern: 'tv_endrooo_aktif.m3u'
