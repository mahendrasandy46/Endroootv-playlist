name: Auto-Check Playlist tv_endroo

on:
  schedule:
    # Terjadwal berjalan setiap pukul 07:00 WIB otomatis
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Memunculkan tombol manual untuk menjalankan proses

permissions:
  contents: write

jobs:
  filter-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter URL Aktif
        run: |
          # Nama file sumber dan file tujuan
          INPUT="tv_endrooo.m3u"
          ACTIVE="tv_endrooo_aktif.m3u"

          # Reset file aktif
          rm -f "$ACTIVE"
          echo "#EXTM3U" > "$ACTIVE"

          CURRENT_INFO=""
          
          # Proses baca per baris
          tr -d '\r' < "$INPUT" | while IFS= read -r line || [ -n "$line" ]; do
            if [[ $line == #EXTINF* ]]; then
              CURRENT_INFO="$line"
            elif [[ $line == http* ]]; then
              # Cek URL dengan curl (timeout 5 detik)
              if curl -s -f -I -m 5 "$line" > /dev/null; then
                echo "$CURRENT_INFO" >> "$ACTIVE"
                echo "$line" >> "$ACTIVE"
              fi
              CURRENT_INFO=""
            fi
          done

      - name: Commit File Baru ke GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync: Membersihkan tv_endrooo.m3u dari link mati"
          file_pattern: 'tv_endrooo_aktif.m3u'
